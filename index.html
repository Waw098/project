<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="coversion">
        <h2>Metric/Imperial Unit Coversion</h2>
        <input id="input" type="text" placeholder="20">
        <button id="convert">Convert</button>
    </div>
    <div class="output">
        <div class="result">
            <h3>Length (Meter/Feet)</h3>
            <p id="m2f">20 meters = 65.616 feet| 20 feet = 6.096 meters</p>   
        </div>
        <div class="result">
            <h3>Volume (Liters/Gallons)</h3>
            <p id="l2g">20 liters = 5.284 gallons| 20 gallons = 75.708 liters</p>   
        </div>
        <div class="result">
            <h3>Mass (Kilograms/Pounds)</h3>
            <p id="m2k">20 kilos = 44.092 pounds| 20 pounds = 9.072 kilos</p>   
        </div>

    </div>

    
    <script src="index.js"></script>
    
</body>
</html>
